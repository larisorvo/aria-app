<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-j1tuPX75+l/7HNtTDNYXuuGxWZ+7+GQ91CQNk6g5r2Q='">
<meta name="referrer" content="no-referrer">
<title>Aria – TikTok sign-in</title>
<style>body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#222}code{word-break:break-all;background:#f2f2f2;padding:2px 4px}</style></head>
<body>
<h1>TikTok sign-in</h1>
<p id="msg">This page only shows the sign-in result that TikTok put in its address. Nothing is sent anywhere.</p>
<p>Copy this page's whole address (address bar, ⌘A, ⌘C) and press Enter in the waiting Terminal. The code works for a few minutes only.</p>
<script>var q=new URLSearchParams(location.search);var m=document.getElementById("msg");if(q.get("error")){m.textContent="TikTok returned an error: "+q.get("error")+" "+(q.get("error_description")||"");}else if(q.get("code")){m.textContent="Sign-in code received. Copy the address now.";}</script>
</body></html>
